name: CI

on:
  push:
    branches: [master]
    paths:
      - "portfolio/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "portfolio/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
