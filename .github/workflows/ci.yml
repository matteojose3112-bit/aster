name: CI

on:
  push:
    branches: [master]
    paths:
      - "portfolio/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "portfolio/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  validate:
    name: Lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible dependency security updates
        run: npm audit fix

      - name: Commit updated lockfile to this PR branch
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet -- portfolio/package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add portfolio/package-lock.json
            git commit -m 'security(deps): update vulnerable npm packages'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
